[project]
name = "forge-harness"
version = "0.1.0"
description = "Forge: a model-agnostic, multi-agent software-engineering harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "prompt-toolkit>=3.0.53",
]

[project.scripts]
forge = "forge.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: tests that call real model endpoints (opt-in via FORGE_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = ["src/forge/skills/anthropic"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF", "SIM"]
ignore = ["RUF012", "SIM905"]

[tool.ruff.lint.per-file-ignores]
# Pattern tables read best one rule per line.
"src/forge/tools/**" = ["E501"]
"src/forge/cli/**" = ["E501", "ASYNC240", "RUF001"]
"src/forge/skills/**" = ["E501"]
"src/forge/harness/**" = ["E501", "ASYNC210", "ASYNC221"]
"src/forge/policies/commands.py" = ["E501"]
"src/forge/agents/**" = ["E501"]
"src/forge/workflow/router.py" = ["E501"]
"src/forge/research/**" = ["E501"]
# Tests verify results with plain blocking subprocess calls.
"tests/**" = ["ASYNC210", "ASYNC221", "ASYNC240", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["forge"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = ["src/forge/skills/anthropic"]
